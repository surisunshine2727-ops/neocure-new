};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const adminAuth=firebase.auth(),adminDb=firebase.database();
const read=(k,d=[])=>{try{return JSON.parse(localStorage.getItem(STORE+'_'+k)||JSON.stringify(d))}catch(e){return d}};
const write=(k,v)=>localStorage.setItem(STORE+'_'+k,JSON.stringify(v));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function adminMessage(t){
 $('adminAuthMsg').textContent=t;

}

 $('authModal').classList.add('hidden');
 document.body.classList.remove('auth-modal-open');

}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('authModal').classList.contains('hidden'))closeAuthModal();});

// Admin session safety: 5-minute idle timeout, expiry checks on navigation/resume,
// and sign-out so browser Back cannot restore an authenticated dashboard.
const NC_ADMIN_IDLE_MS = 5 * 60 * 1000;
const NC_ADMIN_SESSION_KEY = 'nc_admin_session_expiry_v1';
let ncAdminIdleTimer = null;
let ncAdminSessionEnding = false;
function ncAdminTouch(){
  if(!adminAuth.currentUser || ncAdminSessionEnding) return;

let ncDealerRequestListener=null;

let ncDealerRequestBootstrapped=false;
async function ncStartDealerRequestWatcher(){
  if(ncDealerRequestListener) ncDealerRequestListener.off();
  const query=adminDb.ref('users').orderByChild('role').equalTo('dealer');
  try{const initial=await query.once('value');ncKnownDealerIds=new Set();initial.forEach(c=>ncKnownDealerIds.add(c.key));ncDealerRequestBootstrapped=true;await ncUpdatePendingDealerCount();}catch(e){console.warn('Dealer request initial load:',e.message||e);}
  ncDealerRequestListener=query;
  ncDealerRequestListener.on('child_added',snap=>{
    const u=snap.val()||{}; const uid=snap.key;
    const pending=u.approved!==true && !['Approved','Active'].includes(String(u.status||''));
    if(ncDealerRequestBootstrapped && pending && !ncKnownDealerIds.has(uid)){
      const who=u.profile?.shop||u.shop||u.phone||'ಹೊಸ Dealer';
      adminMessage('ಹೊಸ Dealer Request ಬಂದಿದೆ: '+who);
      try{ if('Notification' in window && Notification.permission==='granted') new Notification('NEOCURE – New Dealer Request',{body:who+' · Approval ಬೇಕಾಗಿದೆ'}); }catch(e){}
      const list=$('firebaseDealerList'); if(list) loadFirebasePeople('dealer','firebaseDealerList');
    }
    ncKnownDealerIds.add(uid); ncUpdatePendingDealerCount();
  });

function ncDealerIsPending(userData){

  if(['approved','active','rejected','disabled','blocked'].includes(status)) return false;
  return u.role==='dealer';
}
async function ncUpdatePendingDealerCount(){
  try{
    const snap=await adminDb.ref('users').orderByChild('role').equalTo('dealer').once('value');
    let pending=0;
    snap.forEach(c=>{if(ncDealerIsPending(c.val()))pending++;});
    const totalEl=$('dealerCount');if(totalEl)totalEl.textContent=String(snap.numChildren());
    const badge=$('pendingDealerCount');if(badge)badge.textContent=String(pending);

async function saveDealerProfileToFirebase(uid,phone){
 const existingSnap=await adminDb.ref('appData/'+uid).once('value');
 const existingRaw=existingSnap.val()||{};
 const profileKey='nc_dealer_profile_'+phone;
 const existingProfile=ncDecodeStored(existingRaw[encodeURIComponent(profileKey)]??existingRaw[profileKey])||{};
 const profile={...existingProfile,shop:$('admDealerShop').value.trim(),owner:$('admDealerOwner').value.trim(),address:$('admDealerAddress').value.trim(),city:$('admDealerCity').value.trim(),updatedAt:Date.now()};
 if(!profile.shop){$('admDealerProfileNote').textContent='Shop Name ಅಗತ್ಯ.';return;}
 try{
  const updates={};
  updates['appData/'+uid+'/'+encodeURIComponent('nc_dealer_profile_'+phone)]=JSON.stringify(profile);
  await adminDb.ref().update(updates);
  $('admDealerProfileNote').textContent='ಈ Dealerನ Details Firebaseಗೆ Update ಆಗಿವೆ.';
  addAudit('Updated dealer profile and credit limit '+phone);
 }catch(e){$('admDealerProfileNote').textContent='Update ಆಗಲಿಲ್ಲ: '+(e.code||e.message)+' — Firebase Rules ಪರಿಶೀಲಿಸಿ.';}
}
async function saveDealerCreditLimitToFirebase(uid,phone){
 const input=$('admDealerCreditLimit'),note=$('admCreditLimitNote');
 const creditLimit=Number(input?.value);
 if(!Number.isFinite(creditLimit)||creditLimit<0){if(note)note.textContent='ಸರಿಯಾದ Credit Limit ನಮೂದಿಸಿ.';return;}
 try{
  const snap=await adminDb.ref('appData/'+uid).once('value'),raw=snap.val()||{};
  const profileKey='nc_dealer_profile_'+phone;
  const old=ncDecodeStored(raw[encodeURIComponent(profileKey)]??raw[profileKey])||{};
  const profile={...old,creditLimit,updatedAt:Date.now()};
  const updates={};
  updates['appData/'+uid+'/'+encodeURIComponent(profileKey)]=JSON.stringify(profile);
  updates['appData/'+uid+'/'+encodeURIComponent('nc_dealer_credit_limit_'+phone)]=JSON.stringify(creditLimit);
  // Dealer App listens to users/{uid}.creditLimit for its live account display.
  updates['users/'+uid+'/creditLimit']=creditLimit;
  await adminDb.ref().update(updates);
  if(note)note.textContent='ಈ Dealerನ Credit Limit Firebaseಗೆ Update ಆಗಿದೆ.';
  addAudit('Updated dealer credit limit '+phone);
 }catch(e){if(note)note.textContent='Update ಆಗಲಿಲ್ಲ: '+(e.code||e.message)+' — Firebase Rules ಪರಿಶೀಲಿಸಿ.';}
}

async function saveDealerHistoryUpdates(uid,phone,kind,count,ledgerIds=[]){
 try{
  const snap=await adminDb.ref('appData/'+uid).once('value'),raw=snap.val()||{};
  const key='nc_dealer_'+kind+'_'+phone,stored=raw[encodeURIComponent(key)]??raw[key];
  let arr=ncDecodeStored(stored)||[];if(!Array.isArray(arr))arr=[];
  arr.forEach((x,i)=>{let displayIndex=i;if(kind==='payments'&&Array.isArray(ledgerIds)){const found=ledgerIds.findIndex(v=>v&&v.id===String(x.id||''));if(found>=0)displayIndex=found;}const el=$(kind==='orders'?'admOrderStatus'+i:'admPaymentStatus'+displayIndex);if(el)x.status=el.value;});
  await adminDb.ref('appData/'+uid+'/'+encodeURIComponent(key)).set(JSON.stringify(arr));
  if(kind==='payments'&&Array.isArray(ledgerIds)&&ledgerIds.length){
   const updates={};ledgerIds.forEach((item,i)=>{const ledgerKey=item&&item.ledgerKey;const el=$('admPaymentStatus'+i);if(ledgerKey&&el)updates['dealer_ledger/'+phone+'/'+ledgerKey+'/status']=el.value;});
   if(Object.keys(updates).length)await adminDb.ref().update(updates);
  }
  const note=$(kind==='orders'?'admOrdersNote':'admPaymentsNote');if(note)note.textContent='ಈ Dealerನ '+(kind==='orders'?'Order':'Payment')+' History Update ಆಗಿದೆ.';
  addAudit('Updated dealer '+kind+' '+phone);
 }catch(e){const note=$(kind==='orders'?'admOrdersNote':'admPaymentsNote');if(note)note.textContent='Update ಆಗಲಿಲ್ಲ: '+(e.code||e.message)+' — Firebase Rules ಪರಿಶೀಲಿಸಿ.';}
}

function couponIsRedeemed(x){
 const st=String(x.status||'').toLowerCase();
 return x.redeemed===true||x.used===true||x.claimed===true||/redeem|used|claim|paid/.test(st);
}
function couponDate(v){
 if(!v)return '—';
 const d=new Date(Number(v)||v);
 return isNaN(d.getTime())?'—':d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function migrateLocalCouponsToFirebase(){
 const localCoupons=read('coupons',[]);
 if(!Array.isArray(localCoupons)||!localCoupons.length)return 0;
 let migrated=0;
 for(const x of localCoupons){
  if(!x||!x.code)continue;
  const ref=adminDb.ref('coupons/'+String(x.code).toUpperCase());
  const snap=await ref.once('value');
  if(!snap.exists()){
   await ref.set({
    code:String(x.code).toUpperCase(),
    batch:x.batch||'Legacy Batch',
    reward:Number(x.reward||0),
    status:x.status||'Unused',
    createdAt:Number(x.createdAt)||Date.now()
   });
   migrated++;
  }
 }
 return migrated;
}

else if(k==='reports'){const d=read('dealers'),apps=read('applicators'),orders=read('orders'),pay=read('payments');b.innerHTML=`<div class="grid"><div class="stat">Dealers<strong>${d.length}</strong></div><div class="stat">Applicators<strong>${apps.length}</strong></div><div class="stat">Orders<strong>${orders.length}</strong></div><div class="stat">Payments<strong>${pay.length}</strong></div></div><p class="muted" style="margin-top:12px">ಈ ವರದಿಯ ದಾಖಲೆಗಳು ಪ್ರಸ್ತುತ ಈ Browserನ Local Storage‌ನಿಂದ ಬರುತ್ತವೆ; Firebase live reports ಇನ್ನೂ ಸಂಪರ್ಕಿಸಿಲ್ಲ.</p>`}
else if(k==='settings'){b.innerHTML=`<div class="notice">Admin ID / Password ಅನ್ನು HTMLನಲ್ಲಿ ಸಂಗ್ರಹಿಸಬೇಡಿ. Firebase Authentication, MFA, HTTPS ಮತ್ತು Realtime Database Security Rules ಬಳಸಿ.</div>`+field('Current Admin ID (display only)','sId','Not configured')+`<button class="btn secondary" onclick="alert('Connect Firebase Auth to configure admin account securely.')">Configure Secure Login (Firebase)</button>`}
else if(k==='audit'){b.innerHTML=listRows(read('audit'),x=>`${x.at} · ${x.action}`)}
}
function listRows(arr,fn){return '<h3 style="margin-top:20px">Records</h3>'+(arr.length?arr.map(x=>`<div class="listitem">${esc(fn(x))}</div>`).join(''):'<p class="muted">No records yet.</p>')}
function saveDealer(){let x={phone:$('dPhone').value.trim(),shop:$('dShop').value.trim(),owner:$('dOwner').value.trim(),status:$('dStatus').value};if(!/^\d{10}$/.test(x.phone)||!x.shop){alert('Dealer mobile ಮತ್ತು Shop Name ಪರಿಶೀಲಿಸಿ');return}let a=read('dealers');a=a.filter(v=>v.phone!==x.phone);a.push(x);write('dealers',a);addAudit('Saved dealer '+x.phone);renderModule('dealers');refreshStats()}
function saveApplicator(){let x={phone:$('aPhone').value.trim(),name:$('aName').value.trim(),balance:Number($('aBalance').value||0)};if(!/^\d{10}$/.test(x.phone)||!x.name){alert('Applicator mobile ಮತ್ತು ಹೆಸರು ನಮೂದಿಸಿ');return}let a=read('applicators').filter(v=>v.phone!==x.phone);a.push(x);write('applicators',a);addAudit('Saved applicator '+x.phone);renderModule('applicators');refreshStats()}
async function findDealerByPhone(phone){const snap=await adminDb.ref('users').once('value');const users=snap.val()||{};for(const [uid,u] of Object.entries(users)){if(String(u.phone||'').replace(/\D/g,'')===phone&&u.role==='dealer')return {uid,user:u};}return null;}
async function saveRates(){const phone=$('rPhone').value.replace(/\D/g,'');if(!/^\d{10}$/.test(phone)){alert('Dealer mobile 10 digit ಇರಬೇಕು');return;}const found=await findDealerByPhone(phone);if(!found){$('rateSaved').textContent='ಈ mobileಗೆ Dealer account Firebaseನಲ್ಲಿ ಸಿಗಲಿಲ್ಲ.';return;}const rates={epoxy:+$('rEpoxy').value||0,hardener:+$('rHardener').value||0,primer:+$('rPrimer').value||0,kit:+$('rKit').value||0,updatedAt:Date.now()};try{const key='nc_dealer_rates';const updates={};updates['appData/'+found.uid+'/'+encodeURIComponent(key)]=JSON.stringify(rates);updates['users/'+found.uid+'/dealerRates']=rates;await adminDb.ref().update(updates);addAudit('Updated Firebase rates '+phone);$('rateSaved').innerHTML='<p class=\"notice\">Dealer '+esc(phone)+' rates Firebaseಗೆ save ಆಗಿವೆ.</p>';}catch(e){$('rateSaved').textContent='Firebase save ವಿಫಲ: '+e.message;}}
function saveStatus(key,id,status){let v=$(id).value.trim();if(!v){alert('Record ID ನಮೂದಿಸಿ');return}let a=read(key),x=a.find(z=>z.id===v);if(!x){alert('ಈ Demoನಲ್ಲಿ record ಸಿಗಲಿಲ್ಲ.');return}x.status=$(status).value;write(key,a);addAudit('Updated '+key+' '+v);renderModule(activeModule);refreshStats()}
async function saveLedger(){const phone=$('lPhone').value.replace(/\D/g,'');const amount=Number($('lAmount').value||0);if(!/^\d{10}$/.test(phone)||amount<=0){alert('Dealer mobile ಮತ್ತು Amount ಸರಿಯಾಗಿರಲಿ');return;}const found=await findDealerByPhone(phone);if(!found){$('ledgerSaved').textContent='ಈ mobileಗೆ Dealer account Firebaseನಲ್ಲಿ ಸಿಗಲಿಲ್ಲ.';return;}const type=$('lType').value;const entry={type,entryType:type,amount,remarks:$('lRemarks').value.trim(),status:'Posted',created:Date.now(),timestamp:Date.now(),date:new Date().toISOString().slice(0,10),source:'ADMIN_LEDGER'};try{await adminDb.ref('dealer_ledger/'+phone).push(entry);addAudit('Firebase ledger entry '+phone);$('ledgerSaved').textContent='Ledger entry Firebaseಗೆ save ಆಗಿದೆ.';await loadAdminLedger(phone);}catch(e){$('ledgerSaved').textContent='Firebase save ವಿಫಲ: '+e.message;}}
async function loadAdminLedger(phone){const box=$('adminLedgerRows');if(!box)return;box.textContent='Loading…';try{const snap=await adminDb.ref('dealer_ledger/'+phone).limitToLast(30).once('value');const rows=[];snap.forEach(c=>rows.push(c.val()||{}));rows.reverse();box.innerHTML=rows.length?rows.map(x=>`<div class=\"listitem\"><b>${esc(x.type||x.entryType||'Entry')} · ₹${Number(x.amount||0).toFixed(2)}</b><span class=\"muted\">${esc(x.remarks||x.status||'')} · ${new Date(Number(x.timestamp||x.created||Date.now())).toLocaleString('en-IN')}</span></div>`).join(''):'<p class=\"muted\">ಈ Dealerಗೆ Ledger entries ಇಲ್ಲ.</p>';}catch(e){box.textContent='Ledger load ವಿಫಲ: '+e.message;}}
function saveRewards(){let x={value:+$('rwValue').value||0,limit:+$('rwLimit').value||0,min:+$('rwMin').value||0,time:$('rwTime').value.trim()};write('rewardSettings',x);addAudit('Reward settings changed');alert('Demo reward settings saved')}
let couponSettingsHTML='';
let couponSettingsValues={};
function backToCouponSettings(){
 const b=$('moduleBody');
 $('module').classList.remove('coupon-output-open');
 $('module').classList.add('coupon-generator-open');
 if(!couponSettingsHTML)return;
 b.innerHTML=couponSettingsHTML;
 Object.entries(couponSettingsValues).forEach(([id,value])=>{const el=$(id);if(el)el.value=value;});
 window.scrollTo(0,0);
}

async function makeCoupons(){
 let qty=Math.min(200,Math.max(1,+$('cQty').value||0)),batch=$('cBatch').value.trim(),reward=+$('cReward').value||0;
 if(!batch||reward<=0){alert('Batch name ಮತ್ತು reward value ಬೇಕು');return}
 if(typeof QRCode==='undefined'){alert('QR library load ಆಗಿಲ್ಲ. Internet connection ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.');return}
 const b=$('moduleBody');
 couponSettingsHTML=b.innerHTML;
 couponSettingsValues={cBatch:$('cBatch').value,cQty:$('cQty').value,cReward:$('cReward').value};
 let created=[],updates={};
 for(let i=0;i<qty;i++){
  let code='NC'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,9).toUpperCase();
  let item={code,batch,reward,status:'Unused',createdAt:firebase.database.ServerValue.TIMESTAMP};
  created.push({...item,createdAt:Date.now()});
  updates[code]={...item,createdAt:firebase.database.ServerValue.TIMESTAMP};
 }
 try{
  await adminDb.ref('coupons').update(updates);
  let local=read('coupons',[]);
  write('coupons',local.concat(created));
  addAudit('Generated '+qty+' Firebase QR coupons');
 }catch(e){
  alert('Firebaseಗೆ QR Save ಆಗಲಿಲ್ಲ: '+(e.message||e)+'. Internet ಮತ್ತು Firebase Rules ಪರಿಶೀಲಿಸಿ.');
  return;
 }
 $('module').classList.remove('coupon-generator-open');
 $('module').classList.add('coupon-output-open');
 b.innerHTML=`<div class="dealer-page-head"><div><h2>Generated QR Coupons</h2><p class="muted" style="margin:5px 0 0">${qty} coupons · ${esc(batch)} · Reward ₹${Number(reward).toFixed(2)}</p></div><button class="btn secondary" style="width:auto;margin:0" onclick="backToCouponSettings()">← Back</button></div>
 <div class="notice">${qty} QR coupons Firebaseಗೆ Save ಆಗಿವೆ. Print ಅಥವಾ Save as PDF ಆಯ್ಕೆಮಾಡಿ.</div>
 <div class="qr-tools no-print">
  <div class="field"><label>Paper Size</label><select id="qrPaper">
    <option value="A4 portrait">A4 Portrait</option><option value="A4 landscape">A4 Landscape</option>
    <option value="A5 portrait" selected>A5 Portrait</option><option value="A5 landscape">A5 Landscape</option>
    <option value="Letter portrait">Letter</option></select></div>
  <div class="field"><label>QR per row / Columns</label><select id="qrCols">
    <option value="1">1 Column</option><option value="2">2 Columns</option><option value="3">3 Columns</option><option value="4" selected>4 Columns</option></select></div>
  <div class="field"><label>QR Code Size</label><select id="qrSize">
    <option value="15">Extra Small (15 mm)</option><option value="18">Small (18 mm)</option><option value="22">Medium (22 mm)</option><option value="28" selected>Large (28 mm)</option><option value="32">Extra Large (32 mm)</option></select></div>
  <div class="field"><label>Font Size</label><select id="qrFont">
    <option value="6">Tiny (6 pt)</option><option value="7">Small (7 pt)</option><option value="8" selected>Normal (8 pt)</option><option value="9">Medium (9 pt)</option><option value="10">Large (10 pt)</option><option value="12">Extra Large (12 pt)</option></select></div>
  <div class="field"><label>Title Font Size</label><select id="qrTitleFont">
    <option value="8">Small (8 pt)</option><option value="10" selected>Normal (10 pt)</option><option value="12">Large (12 pt)</option><option value="14">Extra Large (14 pt)</option></select></div>
  <div class="field"><label>Page Margin</label><select id="qrMargin">
    <option value="3">Extra Narrow (3 mm)</option><option value="5">Narrow (5 mm)</option><option value="8" selected>Normal (8 mm)</option><option value="12">Wide (12 mm)</option></select></div>
  <div class="field"><label>Card Gap</label><select id="qrGap">
    <option value="2">Tight (2 mm)</option><option value="4" selected>Normal (4 mm)</option><option value="6">Wide (6 mm)</option></select></div>
  </div>
  <div class="actions no-print"><button class="btn" onclick="printCouponBatch()">🖨️ Print QR</button><button class="btn gold" onclick="printCouponBatch()">📄 Save as PDF</button></div>
 <p class="muted no-print">Save as PDF ಮಾಡಲು Print dialogನಲ್ಲಿ Destination → Save as PDF ಆಯ್ಕೆಮಾಡಿ. Page size ಮತ್ತು layout ಸ್ವಯಂಚಾಲಿತವಾಗಿ ಸೆಟ್ ಆಗುತ್ತದೆ.</p><div id="couponPrintArea" class="qr-preview"></div>`;
 renderCouponCards(created);
 window.scrollTo(0,0);
}
function renderCouponCards(items){const area=$('couponPrintArea');if(!area)return;area.innerHTML=items.map((x,i)=>`<article class="qr-card"><h4>NEOCURE · ${esc(x.batch)}</h4><div class="qr-code" id="couponQr${i}"></div><p><b>${esc(x.code)}</b></p><p>Reward: ₹${Number(x.reward).toFixed(2)}</p></article>`).join('');items.forEach((x,i)=>new QRCode($('couponQr'+i),{text:x.code,width:120,height:120,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}));}
function printCouponBatch(){
 const area=$('couponPrintArea');
 if(!area||!area.children.length){alert('ಮೊದಲು QR coupons generate ಮಾಡಿ');return}
 const paper=$('qrPaper')?.value||'A5 portrait';
 const cols=Math.min(4,Math.max(1,+$('qrCols')?.value||4));
 const size=+$('qrSize')?.value||28;
 const font=+$('qrFont')?.value||8;
 const titleFont=+$('qrTitleFont')?.value||10;
 const margin=+$('qrMargin')?.value||8;
 const gap=+$('qrGap')?.value||4;
 let style=document.getElementById('couponPrintDynamic');
 if(!style){style=document.createElement('style');style.id='couponPrintDynamic';document.head.appendChild(style)}
 style.textContent=`@media print{
 @page{size:${paper};margin:${margin}mm}
 #couponPrintArea{--qr-cols:${cols};--qr-size:${size}mm;--qr-font:${font}pt;--qr-title-font:${titleFont}pt;grid-template-columns:repeat(${cols},minmax(0,1fr))!important;gap:${gap}mm!important}
 #couponPrintArea .qr-card{padding:3mm!important;min-height:0!important}
 }`;
 window.print();
}
function refreshStatsOnOpen(){refreshStats()}
</script></body></html>
