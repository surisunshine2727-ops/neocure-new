<style>
:root{--bg:#061426;--panel:#0d2036;--panel2:#102a45;--line:#24516f;--cyan:#35d5ff;--blue:#2878ff;--gold:#f5c66b;--text:#eff8ff;--muted:#9bb4c9;--green:#42d6a0;--red:#ff6575}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#123452 0,transparent 36%),linear-gradient(145deg,#030b17,#081a2d 55%,#030b17);color:var(--text);font-family:system-ui,'Noto Sans Kannada',sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
.wrap{width:min(100%,760px);margin:auto;padding:14px 14px 90px}.brand{text-align:center;padding:18px 8px 20px}.brand b{font-size:29px;letter-spacing:5px;color:#a7efff;text-shadow:0 0 22px #19bdfb88}.brand small{display:block;color:#83cbe7;letter-spacing:3px;margin-top:5px;font-weight:700}
.panel{background:linear-gradient(145deg,#102944f2,#08192cf5);border:1px solid #2c6488;border-radius:23px;padding:19px;margin:12px 0;box-shadow:0 12px 32px #0005,inset 0 1px #ffffff0b}
h1,h2,h3,p{margin-top:0}h2{font-size:21px;margin-bottom:8px}h3{font-size:16px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.tag{display:inline-block;color:#73e3ff;background:#0b3550;border:1px solid #286b8e;border-radius:30px;padding:6px 11px;font-size:11px;font-weight:800}
.field{margin:13px 0}.field label{display:block;font-size:13px;color:#b9d4e7;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#061426;border:1px solid #315a78;color:white;border-radius:13px;padding:13px;outline:none}.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #35d5ff20}
.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:800;color:#031321;background:linear-gradient(110deg,#25c8ec,#3477ff);width:100%;margin-top:8px}.btn.secondary{background:#183b58;color:#dff5ff;border:1px solid #356887}.btn.danger{background:#7d2637;color:#fff}.btn.gold{background:linear-gradient(110deg,#e5b957,#ffe19a);color:#30220a}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.keypad button{height:52px;border-radius:12px;border:1px solid #315d7e;background:#122e49;color:white;font-size:20px;font-weight:800}.keypad button:last-child{background:linear-gradient(110deg,#19c7e9,#286cff)}
.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:104px;text-align:left;background:linear-gradient(145deg,#123451,#0a1c30);border:1px solid #286184;border-radius:17px;padding:14px;color:white}.tile .ico{font-size:24px}.tile b{display:block;margin-top:7px;font-size:14px}.tile small{display:block;color:#9ebbd0;margin-top:4px;line-height:1.35}.stat{background:#07182a;border:1px solid #244965;border-radius:15px;padding:13px}.stat strong{display:block;font-size:23px;margin-top:5px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.listitem{padding:13px;border:1px solid #254a66;background:#091b2e;border-radius:13px;margin:9px 0}.listitem b{display:block}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.nav button{background:#102c46;border:1px solid #2c5877;color:#cfeeff;border-radius:20px;padding:8px 12px;font-size:12px}
.notice{padding:12px;border-radius:12px;background:#332b17;border:1px solid #806b31;color:#ffe4a0;font-size:12px;line-height:1.5;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1;min-width:120px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #24435b}th{color:#7ee5ff}td{color:#dceeff}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.wrap{padding-top:22px}}
@media print{
 @page{size:A4 portrait;margin:10mm}
 html,body{background:#fff!important;color:#111!important;min-height:0!important}
 body *{visibility:hidden!important}
 #couponPrintArea,#couponPrintArea *{visibility:visible!important}
 #couponPrintArea{display:grid!important;position:absolute!important;left:0!important;top:0!important;width:100%!important;grid-template-columns:repeat(var(--qr-cols,3),minmax(0,1fr))!important;gap:5mm!important;padding:0!important;margin:0!important}
 .qr-card{break-inside:avoid;page-break-inside:avoid;border:1px dashed #777!important;border-radius:3mm!important;background:#fff!important;color:#111!important;padding:4mm!important;text-align:center!important;min-height:45mm}
 .qr-card h4{color:#111!important;font-size:var(--qr-title-font,10pt)!important;margin:0 0 2mm!important}
 .qr-card .qr-code{display:flex;justify-content:center;align-items:center;margin:0 auto 2mm}
 .qr-card .qr-code img,.qr-card .qr-code canvas{width:var(--qr-size,28mm)!important;height:var(--qr-size,28mm)!important}
 .qr-card p{color:#111!important;font-size:var(--qr-font,8pt)!important;margin:1mm 0!important;overflow-wrap:anywhere}
 .no-print{display:none!important}
}
.qr-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.qr-tools .field{margin:4px 0}.qr-preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.qr-card{background:#fff;color:#111;border:1px solid #cbd5e1;border-radius:12px;padding:12px;text-align:center;break-inside:avoid}
.qr-card h4{margin:0 0 8px;font-size:13px;color:#111}.qr-code{display:flex;justify-content:center;align-items:center;min-height:100px}
.qr-code img,.qr-code canvas{max-width:100%;height:auto}.qr-card p{margin:4px 0;color:#222;font-size:11px;overflow-wrap:anywhere}
@media(max-width:420px){.qr-preview{grid-template-columns:1fr}.qr-tools{grid-template-columns:1fr}}

</style></head>
<body><main class="wrap">
<header class="brand"><b>NEOCURE</b><small>ADMIN CONTROL CENTRE</small></header>

<section id="login1" class="panel">
<span class="tag">SECURE ADMIN LOGIN</span><h2 style="margin-top:14px">Admin Email Login</h2>
<p class="muted">ಅಧಿಕೃತ Admin Email ಮತ್ತು Password ಬಳಸಿ Login ಮಾಡಿ. OTP ಇಲ್ಲ.</p>
<div class="field"><label>Admin Email</label><input id="adminEmail" type="email" autocomplete="username" placeholder="Admin email"></div>
<div class="field"><label>Password</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Password"></div>
<button class="btn" onclick="adminLogin()">Login →</button>
<div id="adminAuthMsg" class="notice hidden"></div>
</section>
<section id="dashboard" class="hidden">
<div class="panel"><div class="row"><div><span class="tag">ADMIN CONTROL</span><h2 style="margin:10px 0 3px">ನಮಸ್ಕಾರ, Admin 👋</h2><p class="muted">Dealer ಮತ್ತು Applicator ನಿರ್ವಹಣೆ</p></div><button class="btn secondary" style="width:auto;margin:0" onclick="logout()">Logout</button></div>
<div class="grid">
<div class="stat"><span class="muted">Dealer Records</span><strong id="dealerCount">0</strong></div>
<div class="stat"><span class="muted">Applicators</span><strong id="appCount">0</strong></div>
<div class="stat"><span class="muted">Pending Payments</span><strong id="paymentCount">0</strong></div>
</div></div>
<div class="nav"><button onclick="showHome()">Dashboard</button><button onclick="openModule('audit')">Audit Log</button><button onclick="openModule('settings')">Settings</button></div>
<div id="home" class="grid">
<button class="tile" onclick="openModule('dealers')"><span class="ico">🏪</span><b>Dealer Approval</b><small>Dealer list, approval, activation</small></button>
<button class="tile" onclick="openModule('applicators')"><span class="ico">👷</span><b>Applicator Management</b><small>Profile, rewards, withdrawal</small></button>
<button class="tile" onclick="openModule('rates')"><span class="ico">🏷️</span><b>Dealer Rates</b><small>Individual product rates</small></button>
<button class="tile" onclick="openModule('orders')"><span class="ico">📦</span><b>Order Management</b><small>COD, Udhaari, Online</small></button>
<button class="tile" onclick="openModule('payments')"><span class="ico">💳</span><b>Payment Approval</b><small>Verify screenshot and amount</small></button>
<button class="tile" onclick="openModule('ledger')"><span class="ico">📒</span><b>Dealer Ledger</b><small>Cash, credit, online entries</small></button>
<button class="tile" onclick="openModule('rewards')"><span class="ico">🎁</span><b>Reward Settings</b><small>Coupon value and payout rules</small></button>
<button class="tile" onclick="openModule('coupons')"><span class="ico">🔳</span><b>Coupon QR Studio</b><small>Generate and print QR batches</small></button>
<button class="tile" onclick="openModule('issues')"><span class="ico">🛠️</span><b>Warranty & Problems</b><small>Product issue reports and photos</small></button>
<button class="tile" onclick="openModule('reports')"><span class="ico">📊</span><b>Reports</b><small>Sales, collection, reward reports</small></button>
<button class="tile" onclick="openModule('settings')"><span class="ico">⚙️</span><b>App Settings</b><small>UPI, security, configuration</small></button>
<button class="tile" onclick="openModule('audit')"><span class="ico">🧾</span><b>Audit Log</b><small>Admin action records</small></button>
</div>
<div id="module" class="panel hidden"><div class="row"><h2 id="moduleTitle">Module</h2><button class="btn secondary" style="width:auto;margin:0" onclick="showHome()">← Back</button></div><div id="moduleBody"></div></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id), STORE='nc_admin_demo_v1';
let activeModule='';
const firebaseConfig = {
  apiKey: "AIzaSyABFenv_KFSxvUvw7KpnW29QB34w4TTcl4",
  authDomain: "neocure-live-2026.firebaseapp.com",
  databaseURL: "https://neocure-live-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "neocure-live-2026",
  storageBucket: "neocure-live-2026.firebasestorage.app",
  messagingSenderId: "651603399266",
  appId: "1:651603399266:web:6a5004ed3e95283f81773b"
};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const adminAuth=firebase.auth(),adminDb=firebase.database(),adminFns=firebase.app().functions('asia-south1');
const read=(k,d=[])=>{try{return JSON.parse(localStorage.getItem(STORE+'_'+k)||JSON.stringify(d))}catch(e){return d}};
const write=(k,v)=>localStorage.setItem(STORE+'_'+k,JSON.stringify(v));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function adminMessage(t){$('adminAuthMsg').textContent=t;$('adminAuthMsg').classList.remove('hidden')}
async function adminLogin(){
  try{
    const email=$('adminEmail').value.trim();
    const password=$('adminPassword').value;
    if(!email || !password) throw new Error('Admin Email ಮತ್ತು Password ನಮೂದಿಸಿ.');
    const cred=await adminAuth.signInWithEmailAndPassword(email,password);
    const snap=await adminDb.ref('admins/'+cred.user.uid).once('value');
    if(snap.val() !== true){
      await adminAuth.signOut();
      throw new Error('ಈ Emailಗೆ Admin ಅನುಮತಿ ಇಲ್ಲ. Firebase Database admins/'+cred.user.uid+' = Boolean true ಇರಬೇಕು.');
    }
    $('login1').classList.add('hidden');
    $('dashboard').classList.remove('hidden');
    refreshStats();
    addAudit('Firebase Admin login');
  }catch(e){adminMessage('Admin Login ವಿಫಲ: '+(e.message||e))}
}
function logout(){
  addAudit('Logout');
  adminAuth.signOut();
  $('dashboard').classList.add('hidden');
  $('login1').classList.remove('hidden');
  $('adminPassword').value='';
}
adminAuth.onAuthStateChanged(async user=>{
  if(!user) return;
  try{
    const snap=await adminDb.ref('admins/'+user.uid).once('value');
    if(snap.val()===true){
      $('login1').classList.add('hidden');$('dashboard').classList.remove('hidden');refreshStats();
    }else{await adminAuth.signOut();}
  }catch(e){await adminAuth.signOut();adminMessage('Admin access check failed: '+e.message)}
});
function refreshStats(){$('dealerCount').textContent=read('dealers').length;$('appCount').textContent=read('applicators').length;$('paymentCount').textContent=read('payments').filter(x=>x.status==='Pending').length}
function addAudit(action){let a=read('audit');a.unshift({action,at:new Date().toLocaleString('en-IN')});write('audit',a.slice(0,200))}
function showHome(){$('module').classList.add('hidden');$('home').classList.remove('hidden');refreshStats()}
const defs={
dealers:['Dealer Management','Dealer Mobile, Shop Name, Owner, Approval Status and individual credit/rate information.'],
applicators:['Applicator Management','Applicator mobile, profile, coupon scans, reward balance, withdrawal requests and payout schedule.'],
rates:['Dealer-wise Product Rates','Set Epoxy, Hardener, Primer and Flooring Kit rate for each dealer.'],
orders:['Order Management','Review COD / Udhaari approval requests and Online Payment orders.'],
payments:['Payment Verification','Review submitted amount, screenshot reference, dealer and verification status.'],
ledger:['Dealer Ledger','Cash Receipt, Order Receipt, UPI collection, credit/debit and running balance.'],
rewards:['Reward Settings','Coupon reward value, daily withdrawal cap, payout time 7–8 PM, minimum withdrawal.'],
coupons:['Coupon QR Studio','Create coupon batch, unique code, reward amount and printable QR sheet.'],
issues:['Warranty & Problem Reports','Customer/site problem reports, photo attachments, warranty requests and resolution status.'],
reports:['Reports','Dealer sales, outstanding, cash collection, online payments, applicator rewards and payouts.'],
settings:['Security & App Settings','Admin account, session timeout, UPI QR settings, app configuration.'],
audit:['Admin Audit Log','Track admin actions with timestamp; review changes and approvals.']
};
function openModule(k){activeModule=k;$('home').classList.add('hidden');$('module').classList.remove('hidden');$('moduleTitle').textContent=defs[k][0];renderModule(k);addAudit('Opened '+defs[k][0])}
function field(label,id,placeholder='',type='text'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}"></div>`}
function renderModule(k){let b=$('moduleBody'),a;
if(k==='dealers'){a=read('dealers');b.innerHTML=field('Dealer Mobile','dPhone','10 digit mobile','tel')+field('Shop Name','dShop','Shop name')+field('Owner Name','dOwner','Owner name')+`<div class="field"><label>Status</label><select id="dStatus"><option>Pending Approval</option><option>Approved</option><option>Rejected</option></select></div><button class="btn" onclick="saveDealer()">Save Dealer Record</button><h3 style="margin-top:20px">Dealer Records</h3>${a.map((x,i)=>`<div class="listitem"><b>${esc(x.shop)} · ${esc(x.phone)}</b><span class="muted">${esc(x.owner)} · ${esc(x.status)}</span></div>`).join('')||'<p class="muted">No dealer records in this demo yet.</p>'}`}
else if(k==='applicators'){a=read('applicators');b.innerHTML=field('Applicator Mobile','aPhone','10 digit mobile','tel')+field('Applicator Name','aName','Name')+field('Reward Balance (₹)','aBalance','0','number')+`<button class="btn" onclick="saveApplicator()">Save Applicator</button><h3 style="margin-top:20px">Applicators</h3>${a.map(x=>`<div class="listitem"><b>${esc(x.name)} · ${esc(x.phone)}</b><span class="muted">Reward ₹${Number(x.balance||0).toFixed(2)}</span></div>`).join('')||'<p class="muted">No applicators in this demo yet.</p>'}`}
else if(k==='rates'){b.innerHTML=field('Dealer Mobile','rPhone','Dealer mobile','tel')+field('Epoxy Rate / pack ₹','rEpoxy','0','number')+field('Hardener Rate / pack ₹','rHardener','0','number')+field('Primer Rate / pack ₹','rPrimer','0','number')+field('Flooring Kit Rate / pack ₹','rKit','0','number')+`<button class="btn" onclick="saveRates()">Save Dealer Rates</button><div id="rateSaved"></div>`}
else if(k==='orders'){a=read('orders');b.innerHTML=field('Order ID','oId','Order ID')+`<div class="field"><label>Order Status</label><select id="oStatus"><option>Pending Admin Approval</option><option>Payment Verification Pending</option><option>Approved</option><option>Rejected</option><option>Dispatched</option></select></div><button class="btn" onclick="saveStatus('orders','oId','oStatus')">Update Order Status</button>`+listRows(a,x=>`${x.id} · ${x.status}`)}
else if(k==='payments'){a=read('payments');b.innerHTML=field('Payment ID','pId','Payment ID')+`<div class="field"><label>Verification Status</label><select id="pStatus"><option>Pending</option><option>Approved</option><option>Rejected</option></select></div><button class="btn" onclick="saveStatus('payments','pId','pStatus')">Update Payment</button>`+listRows(a,x=>`${x.id} · ₹${x.amount} · ${x.status}`)}
else if(k==='ledger'){b.innerHTML=field('Dealer Mobile','lPhone','Dealer mobile','tel')+`<div class="field"><label>Entry Type</label><select id="lType"><option>Cash Receipt</option><option>Order Receipt</option><option>Udhaari Debit</option><option>UPI Receipt</option></select></div>`+field('Amount ₹','lAmount','Amount','number')+field('Remarks','lRemarks','Note')+`<button class="btn" onclick="saveLedger()">Save Ledger Entry</button>`+listRows(read('ledger'),x=>`${x.phone} · ${x.type} · ₹${x.amount}`)}
else if(k==='rewards'){b.innerHTML=field('Reward per Coupon ₹','rwValue','e.g. 10','number')+field('Daily Withdrawal Limit ₹','rwLimit','e.g. 500','number')+field('Minimum Withdrawal ₹','rwMin','e.g. 100','number')+field('Payout Window','rwTime','7 PM – 8 PM')+`<button class="btn" onclick="saveRewards()">Save Reward Settings</button>`}
else if(k==='coupons'){b.innerHTML=field('Batch Name','cBatch','Batch')+field('Number of Coupons (max 200)','cQty','e.g. 50','number')+field('Reward per Coupon ₹','cReward','e.g. 10','number')+`<button class="btn" onclick="makeCoupons()">Generate QR Coupons</button><div id="couponResult"></div>`}
else if(k==='issues'){a=read('issues');b.innerHTML=field('Report ID','iId','Report ID')+`<div class="field"><label>Resolution Status</label><select id="iStatus"><option>Received</option><option>Under Review</option><option>Resolved</option><option>Rejected</option></select></div><button class="btn" onclick="saveStatus('issues','iId','iStatus')">Update Report</button>`+listRows(a,x=>`${x.id} · ${x.status}`)}
else if(k==='reports'){const d=read('dealers'),apps=read('applicators'),orders=read('orders'),pay=read('payments');b.innerHTML=`<div class="grid"><div class="stat">Dealers<strong>${d.length}</strong></div><div class="stat">Applicators<strong>${apps.length}</strong></div><div class="stat">Orders<strong>${orders.length}</strong></div><div class="stat">Payments<strong>${pay.length}</strong></div></div><p class="muted" style="margin-top:12px">ಈ ವರದಿಯ ದಾಖಲೆಗಳು ಪ್ರಸ್ತುತ ಈ Browserನ Local Storage‌ನಿಂದ ಬರುತ್ತವೆ; Firebase live reports ಇನ್ನೂ ಸಂಪರ್ಕಿಸಿಲ್ಲ.</p>`}
else if(k==='settings'){b.innerHTML=`<div class="notice">Admin ID / Password ಅನ್ನು HTMLನಲ್ಲಿ ಸಂಗ್ರಹಿಸಬೇಡಿ. Firebase Authentication, MFA, HTTPS ಮತ್ತು Realtime Database Security Rules ಬಳಸಿ.</div>`+field('Current Admin ID (display only)','sId','Not configured')+`<button class="btn secondary" onclick="alert('Connect Firebase Auth to configure admin account securely.')">Configure Secure Login (Firebase)</button>`}
else if(k==='audit'){b.innerHTML=listRows(read('audit'),x=>`${x.at} · ${x.action}`)}
}
function listRows(arr,fn){return '<h3 style="margin-top:20px">Records</h3>'+(arr.length?arr.map(x=>`<div class="listitem">${esc(fn(x))}</div>`).join(''):'<p class="muted">No records yet.</p>')}
function saveDealer(){let x={phone:$('dPhone').value.trim(),shop:$('dShop').value.trim(),owner:$('dOwner').value.trim(),status:$('dStatus').value};if(!/^\d{10}$/.test(x.phone)||!x.shop){alert('Dealer mobile ಮತ್ತು Shop Name ಪರಿಶೀಲಿಸಿ');return}let a=read('dealers');a=a.filter(v=>v.phone!==x.phone);a.push(x);write('dealers',a);addAudit('Saved dealer '+x.phone);renderModule('dealers');refreshStats()}
function saveApplicator(){let x={phone:$('aPhone').value.trim(),name:$('aName').value.trim(),balance:Number($('aBalance').value||0)};if(!/^\d{10}$/.test(x.phone)||!x.name){alert('Applicator mobile ಮತ್ತು ಹೆಸರು ನಮೂದಿಸಿ');return}let a=read('applicators').filter(v=>v.phone!==x.phone);a.push(x);write('applicators',a);addAudit('Saved applicator '+x.phone);renderModule('applicators');refreshStats()}
function saveRates(){let phone=$('rPhone').value.trim();if(!/^\d{10}$/.test(phone)){alert('Dealer mobile 10 digit ಇರಬೇಕು');return}let rates={epoxy:+$('rEpoxy').value||0,hardener:+$('rHardener').value||0,primer:+$('rPrimer').value||0,kit:+$('rKit').value||0,updatedAt:Date.now()};let all=read('rates',{});all[phone]=rates;write('rates',all);addAudit('Updated rates '+phone);$('rateSaved').innerHTML='<p class="notice">Demo rates saved for '+esc(phone)+'.</p>'}
function saveStatus(key,id,status){let v=$(id).value.trim();if(!v){alert('Record ID ನಮೂದಿಸಿ');return}let a=read(key),x=a.find(z=>z.id===v);if(!x){alert('ಈ Demoನಲ್ಲಿ record ಸಿಗಲಿಲ್ಲ.');return}x.status=$(status).value;write(key,a);addAudit('Updated '+key+' '+v);renderModule(activeModule);refreshStats()}
function saveLedger(){let x={phone:$('lPhone').value.trim(),type:$('lType').value,amount:+$('lAmount').value||0,remarks:$('lRemarks').value.trim(),at:new Date().toLocaleString('en-IN')};if(!/^\d{10}$/.test(x.phone)||x.amount<=0){alert('Dealer mobile ಮತ್ತು Amount ಸರಿಯಾಗಿರಲಿ');return}let a=read('ledger');a.unshift(x);write('ledger',a);addAudit('Ledger entry '+x.phone);renderModule('ledger')}
function saveRewards(){let x={value:+$('rwValue').value||0,limit:+$('rwLimit').value||0,min:+$('rwMin').value||0,time:$('rwTime').value.trim()};write('rewardSettings',x);addAudit('Reward settings changed');alert('Demo reward settings saved')}
function makeCoupons(){
 let qty=Math.min(200,Math.max(1,+$('cQty').value||0)),batch=$('cBatch').value.trim(),reward=+$('cReward').value||0;
 if(!batch||reward<=0){alert('Batch name ಮತ್ತು reward value ಬೇಕು');return}
 if(typeof QRCode==='undefined'){alert('QR library load ಆಗಿಲ್ಲ. Internet connection ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.');return}
 let a=read('coupons'),created=[];
 for(let i=0;i<qty;i++){let code='NC'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,8).toUpperCase();let item={code,batch,reward,status:'Unused',createdAt:Date.now()};a.push(item);created.push(item)}
 write('coupons',a);addAudit('Generated '+qty+' QR coupons');
 $('couponResult').innerHTML=`<div class="notice">${qty} QR coupons ಸಿದ್ಧವಾಗಿವೆ. ಕೆಳಗಿನ Print ಅಥವಾ Save as PDF ಒತ್ತಿ.</div>
 <div class="qr-tools no-print">
  <div class="field"><label>Paper Size</label><select id="qrPaper">
    <option value="A4 portrait">A4 Portrait</option><option value="A4 landscape">A4 Landscape</option>
    <option value="A5 portrait" selected>A5 Portrait</option><option value="A5 landscape">A5 Landscape</option>
    <option value="Letter portrait">Letter</option></select></div>
  <div class="field"><label>QR per row / Columns</label><select id="qrCols">
    <option value="1">1 Column</option><option value="2">2 Columns</option><option value="3">3 Columns</option><option value="4" selected>4 Columns</option></select></div>
  <div class="field"><label>QR Code Size</label><select id="qrSize">
    <option value="15">Extra Small (15 mm)</option><option value="18">Small (18 mm)</option><option value="22">Medium (22 mm)</option><option value="28" selected>Large (28 mm)</option><option value="32">Extra Large (32 mm)</option></select></div>
  <div class="field"><label>Font Size</label><select id="qrFont">
    <option value="6">Tiny (6 pt)</option><option value="7">Small (7 pt)</option><option value="8" selected>Normal (8 pt)</option><option value="9">Medium (9 pt)</option><option value="10">Large (10 pt)</option><option value="12">Extra Large (12 pt)</option></select></div>
  <div class="field"><label>Title Font Size</label><select id="qrTitleFont">
    <option value="8">Small (8 pt)</option><option value="10" selected>Normal (10 pt)</option><option value="12">Large (12 pt)</option><option value="14">Extra Large (14 pt)</option></select></div>
  <div class="field"><label>Page Margin</label><select id="qrMargin">
    <option value="3">Extra Narrow (3 mm)</option><option value="5">Narrow (5 mm)</option><option value="8" selected>Normal (8 mm)</option><option value="12">Wide (12 mm)</option></select></div>
  <div class="field"><label>Card Gap</label><select id="qrGap">
    <option value="2">Tight (2 mm)</option><option value="4" selected>Normal (4 mm)</option><option value="6">Wide (6 mm)</option></select></div>
  </div>
  <div class="actions no-print"><button class="btn" onclick="printCouponBatch()">🖨️ Print QR</button><button class="btn gold" onclick="printCouponBatch()">📄 Save as PDF</button></div>
 <p class="muted no-print">Save as PDF ಮಾಡಲು Print dialogನಲ್ಲಿ Destination → Save as PDF ಆಯ್ಕೆಮಾಡಿ. Page size ಮತ್ತು layout ಸ್ವಯಂಚಾಲಿತವಾಗಿ ಸೆಟ್ ಆಗುತ್ತದೆ.</p><div id="couponPrintArea" class="qr-preview"></div>`;
 renderCouponCards(created);
}
function renderCouponCards(items){const area=$('couponPrintArea');if(!area)return;area.innerHTML=items.map((x,i)=>`<article class="qr-card"><h4>NEOCURE · ${esc(x.batch)}</h4><div class="qr-code" id="couponQr${i}"></div><p><b>${esc(x.code)}</b></p><p>Reward: ₹${Number(x.reward).toFixed(2)}</p></article>`).join('');items.forEach((x,i)=>new QRCode($('couponQr'+i),{text:x.code,width:120,height:120,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}));}
function printCouponBatch(){
 const area=$('couponPrintArea');
 if(!area||!area.children.length){alert('ಮೊದಲು QR coupons generate ಮಾಡಿ');return}
 const paper=$('qrPaper')?.value||'A5 portrait';
 const cols=Math.min(4,Math.max(1,+$('qrCols')?.value||4));
 const size=+$('qrSize')?.value||28;
 const font=+$('qrFont')?.value||8;
 const titleFont=+$('qrTitleFont')?.value||10;
 const margin=+$('qrMargin')?.value||8;
 const gap=+$('qrGap')?.value||4;
 let style=document.getElementById('couponPrintDynamic');
 if(!style){style=document.createElement('style');style.id='couponPrintDynamic';document.head.appendChild(style)}
 style.textContent=`@media print{
 @page{size:${paper};margin:${margin}mm}
 #couponPrintArea{--qr-cols:${cols};--qr-size:${size}mm;--qr-font:${font}pt;--qr-title-font:${titleFont}pt;grid-template-columns:repeat(${cols},minmax(0,1fr))!important;gap:${gap}mm!important}
 #couponPrintArea .qr-card{padding:3mm!important;min-height:0!important}
 }`;
 window.print();
}
function refreshStatsOnOpen(){refreshStats()}
</script></body></html>
